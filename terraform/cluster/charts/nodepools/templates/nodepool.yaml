apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      # Replace workers monthly so they come back on a fresh, patched image.
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.hetzner.cloud
        kind: HCloudNodeClass
        name: default
      requirements:
        # Hetzner has no spot capacity; without this pin consolidation breaks.
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: kubernetes.io/arch
          operator: In
          values: {{ toJson .Values.architectures }}
        # Lists every allowed location as a topology domain. Without it Karpenter
        # only counts locations that already have a node, so zone spread on
        # pods never reaches the others.
        - key: topology.kubernetes.io/zone
          operator: In
          values: {{ toJson .Values.locations }}
        - key: karpenter.hetzner.cloud/server-family
          operator: In
          values: {{ toJson .Values.serverFamilies }}
  limits:
    cpu: {{ .Values.cpuLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    # One worker at a time, so the ingress never loses every Traefik replica.
    budgets:
      - nodes: "1"
