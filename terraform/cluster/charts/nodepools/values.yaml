# Filled in by terraform/cluster/nodepool.tf.
clusterName: ""
# Hetzner locations workers may launch in (must share the network zone).
locations: [nbg1]
networkID: 0
sshKeyID: 0
userDataSecret:
  namespace: kube-system
  name: karpenter-worker-bootstrap
  key: userData
cpuLimit: "32"
# arm64 (cax) is the cheapest orderable family; workload images must be multi-arch.
architectures: [arm64]
serverFamilies: [cax]
