# The operator's own enablePodMonitor is deprecated; CNPG recommends this.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "pg-cluster.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "pg-cluster.name" . }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
