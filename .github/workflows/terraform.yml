# Static checks only. This workflow never plans against real infrastructure or
# applies: terraform/cluster needs the WireGuard VPN, and applies must come from
# a reviewed local plan (see README).
name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.0
  TFLINT_VERSION: v0.65.0
  TRIVY_VERSION: v0.76.1
  HELM_VERSION: v4.3.1

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned to commit SHAs (tag in the trailing comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate
        run: |
          for root in terraform/infra terraform/cluster; do
            echo "::group::$root"
            # -lockfile=readonly: fail if the committed lock file is incomplete.
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: trivy (IaC misconfigurations)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL terraform

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint (local charts)
        run: helm lint --strict terraform/cluster/charts/*

      - name: shellcheck
        run: shellcheck scripts/*.sh
